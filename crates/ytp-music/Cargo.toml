[package]
name = "ytp-music"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Chip synths, pitch tracking/PSOLA, drums, mastering and MIDI analysis for the YTP machine (port of app/ytpmv)."

[dependencies]
realfft = "3.5"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "render"
harness = false
